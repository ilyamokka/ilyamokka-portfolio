<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ilyamokka's portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <!-- <script src="picture-card.js"></script> -->
  </head>
  <body>
    <main>
        <p class="btn" style="z-index: 9999999; width:fit-content;height:fit-content;position:fixed; top:5vh; left:5vw;" onclick="history.back()">✖</p>
        <p class="btn-right" style="z-index: 9999999; width: fit-content;height:fit-content;position:fixed; top:50%; left:0vw; padding-left: 5vw;padding-right: 5vw;" onclick="move(-1)">❮</p>
        <p class="btn-left" style="z-index: 9999999; width: fit-content;height:fit-content;position:fixed; top:50%; right:0vw; padding-left: 5vw; padding-right: 5vw;" onclick="move(1)">❯</p>
        <div style="width:100%;height:95vh; display: flex;justify-content: center; flex-direction: column;">
            <img id="view" class="move-view">
        <div>
    </main>
    <script>
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        var index = urlParams.get('currentIndex');
        console.log(index)
        var images = [];
        for (let i = 0; ; i++) {
            const src = urlParams.get('src' + i);
            if (src) images.push(src)
            else break
        }
        document.getElementById('view').setAttribute('src',images[index])

        function move(step) {
            index = Number(index) + Number(step)
            while (index < 0) index += images.length;
            index = index % images.length
            document.getElementById('view').setAttribute('src',images[index])
        }
    </script>
  </body>
</html>
