    <script>
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        let name = urlParams.get('for');
        let show = urlParams.get('show');
        let quantityModifier = " are some examples"
        
        if (!name || !show) window.location.replace("index");

        let showArr = show.split('');
        for (let i = 0; i < showArr.length; i++) document.getElementById(showArr[i]).classList.remove('hidden');

        let imgArr = document.querySelectorAll('picture-card');
        for (let i = 0; i < imgArr.length; i++) {
            if (Array.from(imgArr[i].classList).includes('hidden') && name != 'myself') imgArr[i].setAttribute('src', '');
        }

        if (showArr.length === 1) quantityModifier = " is an example"
        if (showArr.length === 2) quantityModifier = " are a couple of examples"

        if (name === "myself") document.querySelectorAll("picture-card").forEach(card => {
            navigator.clipboard.writeText('');

            card.setAttribute('href', '');
            card.addEventListener('click', async () => {
                let text = await navigator.clipboard.readText()
                navigator.clipboard.writeText(text + card.getAttribute('id'));
            });
            card.setAttribute('cap', card.getAttribute('id'));
            card.classList.remove('hidden');
        });

        document.getElementById('name').innerHTML = name;
        document.getElementById('quantityModifier').innerHTML = quantityModifier;
    </script>
